# Preset "fast-compact": a copy of the shipped "standard" preset with dsh-fast-compact
# as the compaction engine (deterministic, zero-LLM; dropped tool traffic becomes session-log seq reference lines).
# Only the compaction row was changed. Regenerate with --force after upgrading dsh.
- insert:
    - id: preset-fast-compact
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fast-compact
        name: Fast Compact (standard)
        description: The shipped "standard" coding agent with dsh-fast-compact (deterministic, zero-LLM, byte-budget compaction; dropped tool traffic becomes session-log seq reference lines, thinking is dropped without references).
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: fast-compact
                name: dsh-fast-compact
                # All keys are optional. BOTH pressure keys are DERIVED per route: headroomTokens AND the
                # window-relative thresholdRatio (knob: headroomRatio) — the row carries neither; see README.
                config:
                  # --- pressure/retention half: owned by @deepseek-ai/dsh-compaction-basic, forwarded untouched ---
                  # Major setting
                  thresholdRatio: 0.8            # Context Window Triggering point, when it got 0.8=80%; SHARE OF THE MESSAGE BUDGET (W-O), not of the window, and it governs the MESSAGES only: the plugin re-expresses it per route so the gate lands on floor((W-O)*ratio) and the engine re-checks that gate against the message surface, so the route's tool schemas can never pre-fill it. On strata-llm/64KB (W=65535 O=32000) 0.8 gates at 26,828 tokens = 40.9% of W; at 0.9 it would be 30,181 tokens = 46.1% of W.
                  contextMaxRatio: 0.25          # Target final Compact Context window Size ratio,0.25=25%, remember after compact there should be extra system prompt will added on it around (1.6(system) + 8.4 (skill+tools))= 10KB will be added(); how much of THAT WINDOW the compiled checkpoint may occupy, as a ratio (not a byte/token length): the reference section is sized from that share, so raising it (or using refLineFormat: none / smaller thoughtChars) lists MORE of the session's older calls line by line — only when even that share cannot hold them do the oldest fold into one range line
                  # Major setting
                  
                  retainRatio: 0.12              # tail kept verbatim: floor((W-O) x this); must stay below the gate above
                  maxTokens: 8192                # summary output cap (omit it and the base reuses the derived headroom)
                  compactionRetries: 1           # extra pressure attempts after the first
                  maxOverflowRetries: 1          # retries once on a model-request overflow
                  auto: true                     # register automatic pressure + overflow compaction
                  # --- content half: owned by dsh-fast-compact (these are the only checkpoint blocks) ---
                  thoughtChars: 200              # newest agent thought quoted verbatim: chars (0 = pointer only)
                  retainLength: 200              # ONE knob for human text: chars kept of EACH user message pinned in the span (and the last request quote); never fewer than one line per message — over budget the clip shrinks and its recall {"seq": N} pointer stays
                  refLineFormat: thought         # dropped tool traffic becomes session-log ref lines: thought | none (the index covers EVERY earlier span of the session, re-read from the log — not only what an older checkpoint's body happened to keep)
                  instructions: null             # session-log instruction block: null = built-in | string = your text | empty string = off
                  #debug: true                   # the checkpoint ALSO states the window accounting (usage before / after / freed %, and the gate that tripped it) AND carries the failed-call trail
                  #debugChars: 400               # per-entry cap for that trail's error text ONLY, in chars (the stats block is not sized by it; debug false = neither block)
      
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
