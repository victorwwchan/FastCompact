# Preset "fast-compact": a copy of the shipped "standard" preset with dsh-fast-compact
# as the compaction engine (deterministic, zero-LLM; dropped tool traffic becomes session-log seq reference lines).
# Only the compaction row was changed. Regenerate with --force after upgrading dsh.
- insert:
    - id: preset-fast-compact
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fast-compact
        name: Fast Compact (standard)
        description: The shipped "standard" coding agent with dsh-fast-compact (deterministic, zero-LLM, byte-budget compaction; dropped tool traffic becomes session-log seq reference lines, thinking is dropped without references).
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: fast-compact
                name: dsh-fast-compact
                # All keys are optional. Only ONE pressure knob is a context decision: thresholdRatio, a
                # SHARE OF THE ROUTE'S RAW CONTEXT WINDOW (see the comment below); headroomTokens and the summary cap (maxTokens) are derived per route and never written here — headroomTokens only sizes the base's own margin, it never gates.
                # a headroomTokens you write here (top level or inside one modelPolicies entry) fails at mount, and says so.
                config:
                  # --- pressure/retention half: owned by @deepseek-ai/dsh-compaction-basic, forwarded untouched ---
                  thresholdRatio: 0.8            # SHARE OF THE RAW WINDOW (W), not of a budget: the plugin gates on the meter's message-only surface, so pressure fires once the MESSAGES alone reach ceil(W x this). On strata-llm/120KB (W=122880) that is 86,016 tokens = 70.0% of W — and messages can hold at most 90,880 there (32,000 are reserved for the reply), so a share above 0.74 on that route clamps to its reachable ceiling (85,965 tokens = 69.9% of W): pressure fires at that last step before the request overflows, and both the mount line and the stats block print the share it wanted next to it. The tool schemas this route's header carries (~7.6k tokens) are priced by the meter but never counted here, so they cannot pre-fill the gate.
                  retainRatio: 0.12              # tail kept verbatim: the BASE sizes it as floor((W-O) x this) and must keep it below whatever gate governs; this row's own after-share is contextMaxRatio below
                  compactionRetries: 1           # extra pressure attempts after the first
                  maxOverflowRetries: 1          # retries once on a model-request overflow
                  auto: true                     # register automatic pressure + overflow compaction
                  # --- content half: owned by dsh-fast-compact (these are the only checkpoint blocks) ---
                  thoughtChars: 200              # newest agent thought quoted verbatim: chars (0 = pointer only)
                  retainLength: 200              # ONE knob for human text: chars kept of EACH user message pinned in the span (and the last request quote); never fewer than one line per message — over budget the clip shrinks and its recall {"seq": N} pointer stays
                  refLineFormat: thought         # dropped tool traffic becomes session-log ref lines: thought | none (the index covers EVERY earlier span of the session, re-read from the log — not only what an older checkpoint's body happened to keep)
                  instructions: null             # session-log instruction block: null = built-in | string = your text | empty string = off
                  contextMaxRatio: 0.25          # how much of THAT WINDOW the compiled checkpoint may occupy, as a ratio (not a byte/token length): the reference section is sized from that share, so raising it (or using refLineFormat: none / smaller thoughtChars) lists MORE of the session's older calls line by line — only when even that share cannot hold them do the oldest fold into one range line
                  debug: true                    # the checkpoint ALSO states the window accounting (usage before / after / freed %, and the gate that tripped it) AND carries the failed-call trail
                  debugChars: 400                # per-entry cap for that trail's error text ONLY, in chars (the stats block is not sized by it; debug false = neither block)
                  # plugin-level keys (optional): harnessEntry, allowUntestedHarness, recallToolName, searchToolName, maxRecallChars, maxSearchHits, headroomRatio
                  # removed legacy keys: maxRequestBytes, targetRequestBytes, contextRatio, retainTurns, retainBytes, keepRecentImages, dryRun, toolRefs, refKeyArg, refThoughtChars, lastThinkingMode, sessionLogInstruction (our `debug` is re-claimed: it now means the failed-call trail AND the window-accounting block above, not hypercompact's old flag)
                  # derived per route at mount (never written here): headroomTokens (4% of that route's window,
                  # capped so it can never eat more than a quarter of what its messages can hold) AND the summary's output cap — maxTokens = min(that route's adapter default, W - gate), so it follows the share you set above; this row writes none.
                  # headroomTokens only sizes the base's OWN margin; the row's thresholdRatio gates, untouched, as a share of W. A maxTokens you still hand-write wins over the derived cap.
                  
                  
                  #modelPolicies:
                  #  # Per-route overrides: provider and model id must match the live route exactly
                  #  # (they come from the request header, not from persona or display name).
                  #  # W = contextWindow declared on that adapter model; O = its request output cap. A ratio named
                  #  # here is a share of THAT route's W; what messages can at most hold is (W-O), so the biggest
                  #  # share that is still a pressure gate is (W-O)/W — every number below respects that ceiling. The summary's output cap (maxTokens) is derived from each entry's own share — never written here.
                  #  - provider: strata-llm        # default route of the web profile
                  #    model: 120KB                # W=122880 O=32000 -> messages top out at 90880 (73.9% of W): gate ceil(0.7*W) = 86,016 tokens = 70.0% of W
                  #    thresholdRatio: 0.7
                  #  - provider: strata-llm
                  #    model: 100KB                # W=102400 O=32000 -> messages top out at 70400 (68.8% of W): gate ceil(0.65*W) = 66,560 tokens = 65.0% of W
                  #    thresholdRatio: 0.65
                  #  - provider: strata-llm        # the tight route: 0.8 is 52,428 tokens, PAST what its messages can hold (33,535 = 51.2% of W): the gate clamps to that ceiling (30,914 tokens) and prints both shares
                  #    model: 64KB                 # W=65535 O=32000 -> gate min(ceil(0.8*W), reachable ceiling 30,914) = 30,914 tokens = 47.2% of W (clamped from 80%)
                  #    thresholdRatio: 0.8
      
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
